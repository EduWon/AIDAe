# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Data Analysis - Let AI Do the Work 
author: Won Gyoung Kim and Pilsun Choi
logo: logo.png
copyright: ""

# Force re-execution of notebooks on each build.
execute:
  execute_notebooks: force

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
# bibtex_bibfiles:
#  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/eduwon/AIDAe  # Online location of your book
  path_to_book: docs  # Optional path to your book, relative to the repository root
  branch: main  # Branch of the repository to use when creating links

# Add GitHub buttons to your book
html:
  use_issues_button: true
  use_repository_button: true

# GitHub Pages specific settings
url: "https://eduwon.github.io"  # Your GitHub Pages site URL
base_url: "/AIDAe/"  # Path to your book on GitHub Pages

execute:
  timeout: 600 